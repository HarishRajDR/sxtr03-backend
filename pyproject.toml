[project]
name = "sxtr03-backend"
version = "0.1.0"
description = "Backend for SXTR//03"
readme = "README.md"
authors = [
    { name = "HarishRajDR", email = "drharishrajdr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
]

[project.scripts]
sxtr03-backend = "sxtr03_backend:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "src.main:app"
